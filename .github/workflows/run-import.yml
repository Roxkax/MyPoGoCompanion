# Run daily import (E02-F01, docs/DAILY-IMPORT.md): starts one run of the daily game-data import on QA or prod by
# hand (Actions → Run daily import → Run workflow), waits for it and shows its run log on the run's summary page.
# Until the admin's "Run now" button (E02-F04), this is how to import outside the schedule. The job itself is
# created and updated by the QA and prod deploys.
name: Run daily import

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which copy to import into
        type: choice
        options: [qa, prod]
        default: qa

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-mypogocompanion

jobs:
  run-import:
    name: Daily import on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Waits for a deploy of the same copy (QA's queue is shared with its deploys and UI tests).
    concurrency:
      group: ${{ inputs.environment == 'prod' && 'prod-environment' || 'qa-environment' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run the import
        env:
          JOB_NAME: job-import-${{ inputs.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRIGGER: manual
        run: |
          if ! az containerapp job show -g "$RESOURCE_GROUP" -n "$JOB_NAME" --only-show-errors -o none 2>/dev/null; then
            echo "::error::There's no $JOB_NAME yet: the ${{ inputs.environment }} deploy creates it (QA: a PR with the \"qa\" label; prod: a merge to main)."
            exit 1
          fi
          .github/scripts/run_import.sh
