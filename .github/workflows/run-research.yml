name: Run weekly researcher

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [qa]
        default: qa

permissions:
  contents: read

jobs:
  diagnose:
    if: inputs.environment == 'qa'
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 35
    concurrency:
      group: qa-environment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build the researcher
        run: dotnet build jobs/MyPoGoCompanion.Jobs --configuration Release
      - name: Run the researcher against QA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          Ai__OpenAiApiKey: ${{ secrets.OPENAI_API_KEY }}
          AI_MONTHLY_CAP_USD: ${{ vars.AI_MONTHLY_CAP_USD }}
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          set -euo pipefail
          connection=$(python3 .github/scripts/npgsql_connection.py --direct)
          echo "::add-mask::$connection"
          export ConnectionStrings__Database="$connection"
          export Ai__MonthlyCapUsd="${AI_MONTHLY_CAP_USD:-5}"
          dotnet run --project jobs/MyPoGoCompanion.Jobs --configuration Release --no-build -- weekly-research
