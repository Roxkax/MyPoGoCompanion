# Checks that a GitHub environment (qa or prod) is set up: signs in to Azure with OIDC (no stored password),
# finds the resources from infra/main.bicep, connects to the environment's Neon database and confirms the
# Static Web Apps token is there, and that the Neon API key for the QA reset works (read only).
# Run it by hand after the setup in docs/SETUP-ENVIRONMENTS.md.
name: Environment check

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to check
        type: choice
        options: [qa, prod]
        default: qa

permissions:
  id-token: write # OIDC sign-in to Azure
  contents: read

env:
  RESOURCE_GROUP: rg-mypogocompanion

jobs:
  check:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure resources
        run: |
          echo "Resource group:  $(az group show -n "$RESOURCE_GROUP" --query name -o tsv)"
          echo "API:             https://$(az containerapp show -g "$RESOURCE_GROUP" -n "api-${{ inputs.environment }}" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Web app:         https://$(az staticwebapp show -g "$RESOURCE_GROUP" -n swa-mypogocompanion --query defaultHostname -o tsv)"

      - name: Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is missing"; exit 1; }
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DATABASE_URL" -tAc "select 'Database: ' || current_database() || ' on PostgreSQL ' || current_setting('server_version')"

      - name: Static Web Apps token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: test -n "$SWA_TOKEN" && echo "Static Web Apps deployment token is set" || { echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN secret is missing"; exit 1; }

      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Neon API for the QA reset (read only)
        # Repository secret NEON_API_KEY and variable NEON_PROJECT_ID (docs/SETUP-ENVIRONMENTS.md, step 6): the key
        # works, the project exists, "qa" is a child of "main", and this environment's DATABASE_URL is that project's
        # "qa" (QA) or "main" (prod) branch. Nothing is changed.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_BRANCH: ${{ inputs.environment == 'prod' && 'main' || 'qa' }}
        run: python3 .github/scripts/neon_reset_qa.py --branch qa --parent main --check --database-branch "$DATABASE_BRANCH"
