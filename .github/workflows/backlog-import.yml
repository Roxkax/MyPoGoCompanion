# Imports planning/backlog into GitHub issues: Epic → Feature → Task (sub-issues), sprints as milestones,
# labels for tier, type and area. Safe to re-run: every issue carries a hidden backlog-key marker and only
# missing issues, links, labels and milestones are created.
name: Backlog import

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be created"
        type: boolean
        default: true
      scope:
        description: "Which tiers to import"
        type: choice
        options: [all, mvp, mvp-and-good-to-have]
        default: all

permissions:
  contents: read
  issues: write

concurrency:
  group: backlog
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build the backlog
        run: python3 planning/backlog/build.py
      - name: Create issues
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SCOPE: ${{ inputs.scope }}
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('planning/backlog/backlog.out.json', 'utf8'));
            const dry = process.env.DRY_RUN === 'true';
            const tiers = { 'all': ['MVP', 'Good to have', 'Future'], 'mvp': ['MVP'], 'mvp-and-good-to-have': ['MVP', 'Good to have'] }[process.env.SCOPE];
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            // GitHub allows about 500 content-creating requests per hour: pace writes and retry on rate limits.
            async function write(fn) {
              for (let attempt = 0; ; attempt++) {
                try { const r = await fn(); await sleep(7500); return r; }
                catch (e) {
                  if ((e.status === 403 || e.status === 429) && attempt < 8) {
                    const wait = Number(e.response?.headers?.['retry-after'] || 60) * 1000;
                    core.info(`rate limited, waiting ${wait / 1000}s`); await sleep(wait); continue;
                  }
                  throw e;
                }
              }
            }
            const marker = key => `<!-- backlog-key: ${key} -->`;

            // existing issues by backlog key
            const existing = {};
            for await (const page of github.paginate.iterator(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 })) {
              for (const i of page.data) {
                const m = (i.body || '').match(/<!-- backlog-key: (\S+) -->/);
                if (m && !i.pull_request) existing[m[1]] = i;
              }
            }
            core.info(`${Object.keys(existing).length} backlog issues already exist`);

            // labels
            const labelDefs = { 'type: epic': '5319e7', 'type: feature': '1d76db', 'type: task': 'c5def5',
              'tier: MVP': '0e8a16', 'tier: Good to have': 'fbca04', 'tier: Future': 'bfdadc' };
            for (const e of data.epics) for (const f of e.features) {
              for (const a of f.area || []) labelDefs[`area: ${a}`] = 'ededed';
              for (const t of f.tasks) if (t.area) labelDefs[`area: ${t.area}`] = 'ededed';
            }
            const haveLabels = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map(l => l.name));
            for (const [name, color] of Object.entries(labelDefs)) {
              if (haveLabels.has(name)) continue;
              core.info(`label ${name}`);
              if (!dry) await write(() => github.rest.issues.createLabel({ owner, repo, name, color }));
            }

            // milestones (sprints)
            const ms = {};
            for (const m of await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all', per_page: 100 })) ms[m.title] = m.number;
            async function milestone(title, description) {
              if (ms[title]) return ms[title];
              core.info(`milestone ${title}`);
              if (dry) return undefined;
              const r = await write(() => github.rest.issues.createMilestone({ owner, repo, title, description }));
              return (ms[title] = r.data.number);
            }
            for (const s of data.sprints) await milestone(s.title, `${s.hours} hours · ${s.tiers.join(', ')}`);
            await milestone('Future (not scheduled)', 'Future items, estimated roughly; scheduled later');
            const msFor = sprint => sprint === null || sprint === undefined ? ms['Future (not scheduled)'] : ms[`Sprint ${sprint}`];

            async function ensure(key, title, body, labels, milestoneNo) {
              if (existing[key]) return existing[key];
              core.info(`create ${key} ${title}`);
              if (dry) return { id: 0, number: 0, dry: true };
              const r = await write(() => github.rest.issues.create({ owner, repo, title, body: `${body}\n\n${marker(key)}`, labels, milestone: milestoneNo }));
              return (existing[key] = r.data);
            }
            async function link(parent, child) {
              if (dry || parent.dry || child.dry) return;
              try {
                await write(() => github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', { owner, repo, issue_number: parent.number, sub_issue_id: child.id }));
              } catch (e) { if (e.status !== 422) throw e; }  // 422: already linked
            }

            for (const e of data.epics) {
              const feats = e.features.filter(f => tiers.includes(f.tier));
              if (!feats.length) continue;
              const eTiers = [...new Set(feats.map(f => f.tier))];
              const epic = await ensure(e.key, `${e.key} · ${e.title}`, `${e.description}\n\n**${e.hours} h** in total.`,
                ['type: epic', ...eTiers.map(t => `tier: ${t}`), ...(e.area || []).map(a => `area: ${a}`)], undefined);
              for (const f of feats) {
                const sprint = f.sprint === null ? 'not scheduled' : (f.sprint === f.sprint_end ? `Sprint ${f.sprint}` : `Sprints ${f.sprint}–${f.sprint_end}`);
                const lines = [`**${f.tier}** · ${sprint} · **${f.hours} h**`];
                if (f.items?.length) lines.push(`Planning items: ${f.items.join(', ')} (planning/PRIORITIES.md)`);
                if (f.screens?.length) lines.push(`Screens: ${f.screens.join(', ')} (design/screens)`);
                if (f.description) lines.push('', f.description);
                lines.push('', ...f.tasks.map(t => `- [ ] ${t.title} — ${t.hours} h`));
                const feat = await ensure(f.key, `${f.key} · ${f.title}`, lines.join('\n'),
                  ['type: feature', `tier: ${f.tier}`, ...(f.area || []).map(a => `area: ${a}`)], msFor(f.sprint));
                await link(epic, feat);
                for (const t of f.tasks) {
                  const tb = `Part of ${f.key} · ${f.title}\n\n**${t.hours} h** (includes testing) · ${t.sprint === null ? 'not scheduled' : 'Sprint ' + t.sprint}`;
                  const task = await ensure(t.key, `${f.key} · ${t.title}`, tb,
                    ['type: task', `tier: ${f.tier}`, ...(t.area ? [`area: ${t.area}`] : [])], msFor(t.sprint));
                  await link(feat, task);
                }
              }
            }
            core.info(dry ? 'Dry run finished: nothing was created.' : 'Import finished.');
