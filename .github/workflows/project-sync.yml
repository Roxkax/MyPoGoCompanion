# Keeps the "MyPoGoCompanion" project board in step with issues and pull requests (see .github/scripts/project-sync.js).
# Run it by hand once to create the board and add every issue; after that it follows issue and PR events, plus a
# nightly catch-up. Needs a classic personal access token with the "project" scope: the secret PROJECT_TOKEN, or
# the "project" scope added to the existing BACKLOG_ADMIN_TOKEN. (The built-in GITHUB_TOKEN can't write to a
# project owned by a user account.)
name: Project sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  issues:
    types: [opened, reopened, closed, edited, labeled]
  pull_request:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number || 'full' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.BACKLOG_ADMIN_TOKEN }}
    steps:
      - name: No token
        if: env.TOKEN == ''
        run: echo "::notice::Add a PROJECT_TOKEN secret (classic token with the project scope) to sync the board."
      - uses: actions/checkout@v5
        if: env.TOKEN != ''
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        if: env.TOKEN != ''
        with:
          github-token: ${{ env.TOKEN }}
          script: await require('./.github/scripts/project-sync.js')({ github, context, core })
