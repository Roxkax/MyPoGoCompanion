# CodeQL code scanning (E00-F09, docs/BRANCH-RULES.md): looks for security problems in the API (C#), the web app and
# UI tests (TypeScript), the Python scripts and the workflows themselves. Runs on every pull request, on main and
# weekly (new queries find new problems in old code). Results: Security → Code scanning, and as annotations on the
# pull request. Not one of the required checks. Free for public repositories.
# Don't also switch on CodeQL's "default setup" in Settings: GitHub refuses results from this workflow while it's on.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      # Upload the results. Set explicitly so it also works on Dependabot's pull requests.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # No build needed: C# is analysed from the source ("build-mode: none").
        language: [actions, csharp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        # Lets CodeQL restore the NuGet packages with the SDK in global.json, for more precise C# results.
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
