# Required check "deploy-qa" (planning/CI-CD.md): puts a pull request on the shared QA environment.
# API image → GitHub Container Registry; migrations → Neon "qa" branch; web app → Static Web Apps environment "qa";
# API → container app api-qa; then the smoke test, the UI tests, and a comment "QA now shows PR #n" on the pull request.
# Required check "ui-tests" is the job of that name below: it reports the UI tests run inside the deploy job.
#
# QA deploys are opt-in (owner, 2026-10-31): only PRs with the "qa" label are deployed. Adding the label deploys the
# PR; while it has the label, every push deploys again; removing it stops that. Without the label the jobs are
# skipped, which branch rules count as passed, so nothing waits for QA. QA shows one PR at a time, one run at a time
# (the "qa-environment" queue on the deploy job). The UI tests run inside that same queued job, so a PR is tested on
# QA before another one replaces it. Pushes that only change notes (Markdown, docs/, planning/, design/) skip the
# deploy. To bring a PR back onto QA: remove and add the "qa" label again, re-run this workflow from the PR's checks,
# or Actions → QA deploy → Run workflow on the PR's branch (always deploys, label or not).
name: QA deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-mypogocompanion
  API_APP: api-qa
  STATIC_WEB_APP: swa-mypogocompanion
  SWA_ENVIRONMENT: qa
  # GitHub Container Registry names must be lowercase.
  IMAGE: ghcr.io/roxkax/mypogocompanion-api
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decides whether this push needs a deploy: not when everything that changed since what QA already shows for this PR
  # (or, if QA shows something else, since the PR's base) is notes only. A skipped deploy-qa counts as passed for
  # branch rules, so the PR can still merge.
  changes:
    name: Anything to deploy?
    # Only PRs with the "qa" label; a "labeled" event only when that label is the one just added (other labels don't
    # redeploy). Pull requests from forks, and runs started by Dependabot (its pushes to its own pull requests), get
    # no secrets, so they can't deploy: to try a dependency update on QA, use Run workflow on its branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' &&
       contains(github.event.pull_request.labels.*.name, 'qa') &&
       (github.event.action != 'labeled' || github.event.label.name == 'qa'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Compare with what QA shows
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          decide() { echo "deploy=$1" >> "$GITHUB_OUTPUT"; echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          [[ $EVENT == workflow_dispatch ]] && decide true "Run by hand: deploying."
          [[ $ACTION == labeled ]] && decide true "The \"qa\" label was added: deploying."

          since=$BASE
          comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("<!-- qa-deploy -->")) | .body')
          if grep -qE "QA now shows PR #$PR\b" <<<"$comment"; then
            on_qa=$(grep -oE 'Commit `[0-9a-f]{7,40}`' <<<"$comment" | head -n 1 | grep -oE '[0-9a-f]{7,40}' || true)
            [[ -n $on_qa ]] && since=$on_qa
          fi

          json=$(gh api "repos/$GITHUB_REPOSITORY/compare/$since...$HEAD") || decide true "Couldn't compare commits: deploying."
          count=$(jq '.files | length' <<<"$json")
          # GitHub lists at most 300 files; nothing listed means a re-run of what QA shows, which is deployed again.
          ((count > 0 && count < 300)) || decide true "$count changed files since ${since:0:7}: deploying."
          notes='(^|/)[^/]+\.md$|^(docs|planning|design)/'
          code=$(jq -r '.files[].filename' <<<"$json" | grep -vE "$notes" || true)
          [[ -n $code ]] && decide true "Changes since ${since:0:7} beyond notes: deploying."
          decide false "Only notes changed since ${since:0:7} (Markdown, docs/, planning/, design/): QA deploy skipped."

  deploy-qa:
    # The name branch rules require.
    name: deploy-qa
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    # One deploy on QA at a time, never cancelled half-way. GitHub keeps at most one waiting: if a newer push arrives
    # meanwhile, the waiting one is cancelled (QA would show the newer PR anyway); re-run it to bring that PR back.
    concurrency:
      group: qa-environment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: qa
      url: ${{ steps.web.outputs.url }}
    permissions:
      contents: read
      packages: write # push the API image
      id-token: write # OIDC sign-in to Azure
      pull-requests: write # the "QA now shows PR #n" comments
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      api-url: ${{ steps.api.outputs.url }}
      web-url: ${{ steps.web.outputs.url }}
      version: ${{ steps.pr.outputs.version }}
      ui-outcome: ${{ steps.ui-run.outcome }}
      ui-passed: ${{ steps.ui.outputs.passed }}
      ui-failed: ${{ steps.ui.outputs.failed }}
      ui-flaky: ${{ steps.ui.outputs.flaky }}
    steps:
      # QA runs exactly what is on the PR's branch (its head commit, the one shown on the PR).
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n $EVENT_PR ]]; then
            number=$EVENT_PR sha=$EVENT_SHA
          else
            read -r number sha < <(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
              --json number,headRefOid --jq '.[0] | "\(.number) \(.headRefOid)"') || true
            if [[ -z $number || $number == null ]]; then
              echo "::error::No open pull request for branch '$GITHUB_REF_NAME'. Run this workflow on a PR's branch."
              exit 1
            fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying PR #$number at ${sha:0:7}"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}

      # --- API image ------------------------------------------------------------------------------------------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/MyPoGoCompanion.Api/Dockerfile
          build-args: VERSION=${{ steps.pr.outputs.version }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.pr.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.pr.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Check the image is public
        # Container Apps pulls the image without a password, so the package must be public (free for public
        # repositories). GitHub creates it private on the first push; docs/SETUP-ENVIRONMENTS.md step 5 shows the switch.
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          visibility=$(gh api "users/$OWNER/packages/container/mypogocompanion-api" --jq .visibility 2>/dev/null || echo unknown)
          echo "Package visibility: $visibility"
          if [[ $visibility == private ]]; then
            echo "::error::The API image package is private, so Azure can't pull it. Make it public (docs/SETUP-ENVIRONMENTS.md, step 5), then re-run this workflow."
            exit 1
          fi

      # --- Database migrations --------------------------------------------------------------------------------
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the migration bundle
        run: |
          dotnet tool restore
          dotnet restore api/MyPoGoCompanion.Data
          dotnet ef migrations bundle --project api/MyPoGoCompanion.Data --configuration Release --output efbundle --force

      - name: Apply migrations to the QA database
        # The QA database is a copy of prod (planning/CI-CD.md), so a PR's migrations are tried on real data here
        # before they reach prod. A migration that fails stops the deploy; the API is left as it was.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::The qa environment has no DATABASE_URL secret"; exit 1; }
          connection=$(python3 .github/scripts/npgsql_connection.py --direct)
          echo "::add-mask::$connection"
          ./efbundle --connection "$connection" || {
            echo "::error::Migrations failed (error above). 'password authentication failed' means the qa DATABASE_URL secret is out of date: docs/SETUP-ENVIRONMENTS.md, 'When a database password changes'."
            exit 1
          }

      # --- Web app --------------------------------------------------------------------------------------------
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: API address
        id: api
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/ui/package-lock.json

      - name: Build the web app
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy the web app to the "qa" environment
        # The Static Web Apps CLI, not the Azure/static-web-apps-deploy action: on pull_request runs the action ignores
        # the environment name and makes a preview site per PR (address "…-<PR number>…"), so QA would have no fixed address.
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: npx --yes @azure/static-web-apps-cli@2.0.10 deploy web/dist --env "$SWA_ENVIRONMENT" --no-use-keychain

      - name: Web app address
        id: web
        run: |
          host=$(az staticwebapp environment list -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" \
            --query "[?buildId=='$SWA_ENVIRONMENT'].hostname | [0]" -o tsv)
          test -n "$host" || { echo "::error::No Static Web Apps environment named '$SWA_ENVIRONMENT' after the deploy"; exit 1; }
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Remove per-PR preview sites
        # Static Web Apps names a per-PR preview site after the PR number (made by the deploy action before we used the
        # CLI). The free plan has few environment slots, so any such leftover is removed; "qa" and production are kept.
        run: |
          names=$(az staticwebapp environment list -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" --query "[].buildId" -o tsv)
          for name in $names; do
            if [[ $name =~ ^[0-9]+$ ]]; then
              echo "Removing preview site '$name'"
              az staticwebapp environment delete -g "$RESOURCE_GROUP" -n "$STATIC_WEB_APP" --environment-name "$name" --yes --only-show-errors
            fi
          done

      # --- API ------------------------------------------------------------------------------------------------
      - name: Deploy the API to api-qa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_URL: ${{ steps.web.outputs.url }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ steps.pr.outputs.sha }}
        run: |
          # The connection string is a Container Apps secret, not a plain setting.
          az containerapp secret set -g "$RESOURCE_GROUP" -n "$API_APP" \
            --secrets "database-url=$DATABASE_URL" --only-show-errors -o none
          # The API listens on 8080 (the bicep placeholder used 80).
          az containerapp ingress update -g "$RESOURCE_GROUP" -n "$API_APP" --target-port 8080 --only-show-errors -o none
          origin=$(sed -E 's#^(https?://[^/]+).*#\1#' <<<"$WEB_URL")
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" --image "$IMAGE_TAG" --only-show-errors -o none \
            --set-env-vars "ConnectionStrings__Database=secretref:database-url" "Cors__AllowedOrigins=$origin"

      - name: Smoke test
        env:
          API_URL: ${{ steps.api.outputs.url }}
          WEB_URL: ${{ steps.web.outputs.url }}
          EXPECTED_VERSION: ${{ steps.pr.outputs.version }}
        run: tests/smoke/smoke.sh

      # --- UI tests (check "ui-tests") ------------------------------------------------------------------------
      # Run here, while this job holds the QA queue, so no other PR can replace QA half-way through. A failure
      # doesn't fail the deploy (QA did get the PR): the "ui-tests" job below turns it into its own red check.
      - name: Install the UI tests
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: UI tests on QA
        id: ui-run
        continue-on-error: true
        working-directory: tests/ui
        env:
          BASE_URL: ${{ steps.web.outputs.url }}
        run: npx playwright test

      - name: UI test summary
        id: ui
        if: ${{ !cancelled() && steps.ui-run.outcome != 'skipped' }}
        run: python3 .github/scripts/ui_results.py tests/ui/results/results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the UI test report
        # The HTML report holds every failed test's trace, screenshot and video.
        if: ${{ !cancelled() && steps.ui-run.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: tests/ui/playwright-report/
          retention-days: 14

      # --- Tell the pull requests -----------------------------------------------------------------------------
      - name: 'Comment "QA now shows PR #n"'
        if: ${{ !cancelled() && steps.pr.outputs.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.pr.outputs.version }}
          API_URL: ${{ steps.api.outputs.url }}
          WEB_URL: ${{ steps.web.outputs.url }}
          OUTCOME: ${{ job.status }}
          UI_OUTCOME: ${{ steps.ui-run.outcome }}
          UI_PASSED: ${{ steps.ui.outputs.passed }}
          UI_FAILED: ${{ steps.ui.outputs.failed }}
          UI_FLAKY: ${{ steps.ui.outputs.flaky }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-qa.yml
        run: python3 .github/scripts/qa_comment.py

  ui-tests:
    # The name branch rules require. The tests themselves run in deploy-qa (inside the QA queue); this job turns
    # their result into a check of its own. Skipped, and so passed, when the deploy was skipped (no "qa" label, or
    # only notes changed).
    name: ui-tests
    needs: [changes, deploy-qa]
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result of the UI tests on QA
        env:
          DEPLOY: ${{ needs.deploy-qa.result }}
          OUTCOME: ${{ needs.deploy-qa.outputs.ui-outcome }}
          PASSED: ${{ needs.deploy-qa.outputs.ui-passed }}
          FAILED: ${{ needs.deploy-qa.outputs.ui-failed }}
          FLAKY: ${{ needs.deploy-qa.outputs.ui-flaky }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ $OUTCOME == success ]]; then
            echo "UI tests passed on QA: ${PASSED:-?} passed, ${FLAKY:-0} only on the retry."
            exit 0
          fi
          if [[ $OUTCOME == failure ]]; then
            echo "::error::UI tests failed on QA: ${FAILED:-?} failed. Summary and report (trace, screenshot, video per failed test): $RUN_URL"
          else
            echo "::error::The UI tests didn't run because the QA deploy ($DEPLOY) stopped first. See deploy-qa: $RUN_URL"
          fi
          exit 1
